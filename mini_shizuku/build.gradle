plugins {
    id 'com.android.library'
}

android {
    compileSdk COMPILE_SDK
    namespace 'ru.playsoftware.mini_shizuku'

    defaultConfig {
        minSdk MIN_SDK
        targetSdk TARGET_SDK
        // 把 keep 规则以「消费方规则」导出给宿主 app 的 R8。
        // server 包被 app_process 按类名反射加载（app 主代码不引用），
        // 不导出则 :app release 的 R8 会把 server.** 当不可达代码删除/改名，
        // 导致 app_process 启动即 ClassNotFoundException、服务永远不上线。
        consumerProguardFiles 'proguard-rules.pro'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    lint {
        abortOnError false
    }
}

dependencies {
    // mini_shizuku client（第三方 SDK + launcher 自身共用）：TCP + 密钥 K。
    // 经 settings.gradle 的 dependencySubstitution 以源码形式替换为 core 仓库的同坐标模块。
    api 'io.github.cctyl.nokia:mini-shizuku-client'
}
