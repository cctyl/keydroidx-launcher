plugins {
    id 'com.android.library'
}

android {
    compileSdk COMPILE_SDK
    namespace 'ru.playsoftware.mini_shizuku'

    defaultConfig {
        minSdk MIN_SDK
        targetSdk TARGET_SDK
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    lint {
        abortOnError false
    }
}
